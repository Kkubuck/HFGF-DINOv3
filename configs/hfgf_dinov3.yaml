# HFGF-DINOv3 (DINOv3 ViT-H+/16): CAMO + COD10K training, 3 GPUs x 3 images.
MODEL:
  META_ARCHITECTURE: "HFGF_DINOv3"
  BACKBONE:
    NAME: "HFGFViTSplit"
  BACKBONE_WEIGHTS: ""
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  SEM_SEG_HEAD:
    NAME: "HFGFMaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 2
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    COMMON_STRIDE: 4

DATASETS:
  TRAIN: ("cod10k_train", "cod_train")
  TEST: ("cod_val", "chameleon", "cod10k_val", "nc4k")

SOLVER:
  IMS_PER_BATCH: 9
  BASE_LR: 0.0001
  MAX_ITER: 17778
  CHECKPOINT_PERIOD: 4445
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.05
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  POLY_LR_POWER: 0.9
  BACKBONE_MULTIPLIER: 0.1
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True

INPUT:
  MIN_SIZE_TRAIN: [128, 153, 179, 204, 230, 256, 281, 307, 332, 358, 384, 409, 435, 460, 486, 512]
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 512
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: [640, 640]
    SINGLE_CATEGORY_MAX_AREA: 1.0
  COLOR_AUG_SSD: True
  SIZE_DIVISIBILITY: 512
  FORMAT: "RGB"

TEST:
  EVAL_PERIOD: 4445
  AUG:
    ENABLED: False

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4
SEED: 42
OUTPUT_DIR: "./outputs/hfgf_dinov3"
VERSION: 2
